name: jekyll build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Installs Ruby 3.3 and puts `gem`/`jekyll` on the PATH
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    # Pin the version so CI builds identically to local/server builds
    - name: install jekyll
      run: gem install jekyll -v 4.3.4

    - name: jekyll build
      run: jekyll build --trace

    # - name: trigger update
    #   env:
    #     DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    #   run: 'curl -fL ${{ secrets.UPDATE_URL }}'

    # Build a second copy for GitHub Pages, which is served from a subpath
    # (https://tudelftgeomatics.github.io/website/)
    - name: jekyll build (github pages)
      run: jekyll build --trace --baseurl /website --destination _site_pages

    - name: upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site_pages

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: deploy to github pages
      id: deployment
      uses: actions/deploy-pages@v4
